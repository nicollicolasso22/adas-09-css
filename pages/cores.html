<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!-- Estilizar através de uma tag style (NÃO FAZER) -->
        <style>
            h1 {
                color: pink;
                font-family: Arial;
            }
            p {
                text-decoration: underline;
            }
        </style>
        <!-- Referenciando um arquivo de CSS (Cascade Style Sheet) (FORMA CORRETA DE FAZER) -->
        <link rel="stylesheet" href="../assets/styles/cores.css">
    </head>
    <body>
        <a href="../index.html">Voltar</a>
        <h1>Cores</h1>
        <!-- Estilização inline (NÃO FAZER) -->
        <p style="text-align: center;">Você pode estilizar as tags com nome da cor, rgb, hexadecimal....</p>

        <img src="https://arquivo.devmedia.com.br/marketing/img/guia-css-38149.png" alt="Imagem de CSS">
    </body>
</html>
